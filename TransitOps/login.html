<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TransitOps | Login</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/login.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- Background Overlay -->

    <div class="overlay"></div>

    <!-- Main Container -->

    <div class="container">

        <!-- Left Side -->

        <div class="left-panel">

            <img src="images/logo.png" class="logo">

            <h1>TransitOps</h1>

            <h3>Smart Transport Operations Platform</h3>

            <p>

                Manage Vehicles, Drivers, Trips,
                Maintenance and Expenses from
                one intelligent platform.

            </p>

            <img src="images/truck.png" class="truck">

        </div>

        <!-- Right Side -->

        <div class="right-panel">

            <div class="login-card">

                <h2>Welcome Back 👋</h2>

                <p>

                    Login to continue

                </p>

                <form id="loginForm">

                    <!-- Email -->

                    <div class="input-group">

                        <label>Email</label>

                        <div class="input-box">

                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter Email"
                                required>

                        </div>

                    </div>

                    <!-- Password -->

                    <div class="input-group">

                        <label>Password</label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter Password"
                                required>

                            <span id="togglePassword">

                                <i class="fa-solid fa-eye"></i>

                            </span>

                        </div>

                    </div>

                    <!-- Options -->

                    <div class="options">

                        <label>

                            <input type="checkbox">

                            Remember Me

                        </label>

                        <a href="#">

                            Forgot Password?

                        </a>

                    </div>

                    <!-- Button -->

                    <button
                        type="submit"
                        class="login-btn">

                        LOGIN

                    </button>

                    <!-- Error Message -->

                    <p
                        id="error"
                        class="error-message">

                    </p>

                </form>

                <div class="footer">

                    <p>

                        TransitOps © 2026

                    </p>

                </div>

            </div>

        </div>

    </div>

    <!-- JS -->

    <script src="js/login.js"></script>

</body>

</html>
